name: Build Phicomm-N1

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 定制 (输入 true 开启)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Initialization environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone and Install
        run: |
          # 1. 绕过拦截拉取代码
          git clone --depth 1 https://ghp.ci openwrt
          
          # 2. 强制进入目录并执行，如果失败直接报错，不给后面报错的机会
          cd openwrt || exit 1
          
          # 3. 更新 feeds
          chmod +x scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event_name == 'workflow_dispatch')

      - name: Compile the firmware
        run: |
          cd openwrt || exit 1
          make defconfig
          make -j$(nproc) || make -j1 V=s
