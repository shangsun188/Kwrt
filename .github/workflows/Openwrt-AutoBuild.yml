name: Build Phicomm-N1

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 定制 (输入 true 开启)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Initialization environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Pull Source Code
        uses: actions/checkout@v3
        with:
          # 直接使用项目 ID，不输入任何 https 或 github.com 字符串
          repository: kiddin9/Kwrt
          ref: master

      - name: Update & Install feeds
        run: |
          # 代码现在就在当前工作目录，不需要 cd 进文件夹
          [ -f scripts/feeds ] && chmod +x scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event_name == 'workflow_dispatch')

      - name: Compile the firmware
        run: |
          make defconfig
          make -j$(nproc) || make -j1 V=s
