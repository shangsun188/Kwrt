name: Build Phicomm-N1 (Strict Fix)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 定制 (输入 true 开启)'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Initialization environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Pull Source Code
        uses: actions/checkout@v3
        with:
          repository: kiddin9/Kwrt
          ref: 25.12

      - name: Update & Install feeds
        run: |
          # 严谨改正：列出所有文件，看看代码到底在哪
          echo "正在搜索源码结构..."
          ls -R | grep "scripts" || echo "根目录没找到 scripts"
          
          # 自动寻找 scripts/feeds 的绝对路径
          FEEDS_PATH=$(find . -name feeds -path "*/scripts/feeds" | head -n 1)
          
          if [ -n "$FEEDS_PATH" ]; then
            SRC_DIR=$(dirname $(dirname "$FEEDS_PATH"))
            echo "找到源码目录: $SRC_DIR"
            cd "$SRC_DIR"
            chmod +x scripts/feeds
            ./scripts/feeds update -a
            ./scripts/feeds install -a
            # 把这个正确的路径传给后面的步骤
            echo "FINAL_SRC_DIR=$PWD" >> $GITHUB_ENV
          else
            echo "错误：在此分支中完全找不到 scripts/feeds！"
            exit 1
          fi

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event_name == 'workflow_dispatch')

      - name: Compile the firmware
        run: |
          cd ${{ env.FINAL_SRC_DIR }}
          make defconfig
          make -j$(nproc) || make -j1 V=s
